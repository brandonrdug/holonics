[package]
name = "life"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "life"
path = "src/lib.rs"

[dependencies]
body = { path = "../body" }
holonic-structure = { path = "../../crates/holonic-structure" }
holonic-language = { path = "../../crates/holonic-language" }
holonic-engine = { path = "../../crates/holonic-engine", default-features = false }
soma-abi = { path = "../abi" }
soma-membrane = { path = "../membrane" }
mount = { path = "../mount" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11"
libc = "0.2"
hound = "3.5"
num-bigint = "0.4"
num-rational = "0.4"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
num-traits = "0.2"
relational-geometry = { path = "../../crates/relational-geometry" }
ron = "0.12"
