[package]
name = "soma-standing-deposit"
version = "0.1.0"
edition = "2021"
publish = false

# Zero dependencies, deliberately.
#
# This tool exists to certify the integrity of the repository's own evidence. A
# registry that verified deposits through a crate it did not itself verify would
# have moved the trust rather than established it, so the SHA-256 here is written
# out and cross-checked two ways: against the NIST vectors in `sha256.rs`, and
# against the archived C++ body's 123 CMake-computed content hashes, which the
# verifier reads natively.
[dependencies]

[[bin]]
name = "standing-deposit"
path = "src/main.rs"
