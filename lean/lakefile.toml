name = "holonics"
defaultTargets = ["Holonics"]

# The foundation: the transitive import closure of `Holonics.Framework`.
[[lean_lib]]
name = "Holonics"

# Every other module. It imports `Holonics`; nothing in `Holonics` imports it.
[[lean_lib]]
name = "HolonicsResearch"
globs = ["HolonicsResearch.*"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.33.0"

[[require]]
name = "cslib"
git = "https://github.com/leanprover/cslib"
rev = "v4.33.0"

[[require]]
name = "physlib"
git = "https://github.com/leanprover-community/physlib"
rev = "686d93d28dedc7ecb238ea7b3568b812fd7065c6"
