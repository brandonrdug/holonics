[package]
name = "life"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "life"
path = "src/lib.rs"

[[bin]]
name = "eros"
path = "src/bin/eros.rs"

[dependencies]
body = { path = "../holonic-body" }
holonic-structure = { path = "../holonic-structure" }
holonic-language = { path = "../holonic-language" }
holonic-engine = { path = "../holonic-engine", default-features = false }
soma-abi = { path = "../holonic-abi" }
soma-membrane = { path = "../holonic-membrane" }
mount = { path = "../holonic-mount" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11"
thiserror = { workspace = true }
libc = "0.2"
hound = "3.5"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
rayon = "1"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
relational-geometry = { path = "../relational-geometry" }
ron = "0.12"
