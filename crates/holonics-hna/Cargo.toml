[package]
name = "holonics-hna"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
life = { path = "../../crates/holonic-life" }
holonic-engine = { path = "../../crates/holonic-engine", default-features = false }
# The core generator facet (`CompiledGeneratorSite::core_generator`), host-only.
holonic-core = { workspace = true }
serde = { workspace = true }
serde_json = "1"
num-rational = { workspace = true }
relational-geometry = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
thiserror = { workspace = true }
tempfile = "3"
tokenizers = "0.21.4"
sha2 = "0.10"

[dev-dependencies]
holonics-circulation-abi = { path = "../../crates/holonic-circulation-abi" }
