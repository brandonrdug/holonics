[package]
name = "holonics-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The engine: the law that trains and its host reference (docs/plans/THE_CONSOLIDATION.md, D1). It depends on no crate of the
# workspace; the card crate and the commands depend on it (C3 and C6 of #603).
[lib]
name = "holonics_engine"
path = "src/lib.rs"

# The certificate's acceptance read (`face`'s `fewer_bits`).
[features]
certificate-check = []

[dependencies]
num-bigint = { workspace = true }
num-rational = { workspace = true }
num-traits = { workspace = true }
num-integer = { workspace = true }
thiserror = { workspace = true }
rayon = "1.12"
