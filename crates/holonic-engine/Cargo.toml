[package]
name = "holonic-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The Holon core owns the exact base (`ExactRatMatrix`, `inertia`, `exact_value`, …); every moved
# item is re-exported at its existing engine path.
holonics = { path = "../holonics" }
# The CUDA Driver API boundary. The engine resident owner reaches the card through this single
# driver census rather than declaring a second `#[link(name = "cuda")]` regime.
holonics-cuda = { path = "../holonics-cuda" }
num-bigint = { workspace = true }
num-integer = "0.1.46"
num-rational = { workspace = true }
num-traits = { workspace = true }
serde = { workspace = true }
serde_json = "1"
sha2 = { workspace = true }
tokenizers = "0.21.4"
thiserror = { workspace = true }

[dev-dependencies]
claxon = "0.4.3"
serde_json = "1"
hound = "3.5.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ron = { workspace = true }
