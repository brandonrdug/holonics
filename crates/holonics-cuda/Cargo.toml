# holonics-cuda — the CUDA driver and device-launch boundary for Holonics.
# NOT engine law: a minimal, safe host-side wrapper over libcuda + one smoke binary proving
# the full path (Rust PTX -> load -> alloc -> memcpy -> launch -> sync -> readback -> exact assert).
# Vulkan is convicted for production (headless Xid); the law stays in Rust (rustc nvptx64 + Driver API).
[package]
name = "holonics-cuda"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "holonics_cuda"
path = "src/lib.rs"

# host reference through the SAME law code the CUDA kernel compiles for nvptx — one mouth, both sides.
[dependencies]
# The backend consumes the framework's exact ratio rings; the framework does not depend on CUDA.
holonics = { path = "../holonics" }

[[bin]]
name = "mount-smoke"
path = "src/bin/mount-smoke.rs"

