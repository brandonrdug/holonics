# holonics-cuda — the CUDA driver and device-launch boundary for Holonics.
# NOT engine law: a minimal, safe host-side wrapper over libcuda + one smoke binary proving
# the full path (Rust PTX -> load -> alloc -> memcpy -> launch -> sync -> readback -> exact assert).
# Vulkan is convicted for production (headless Xid); the law stays in Rust (rustc nvptx64 + Driver API).
[package]
name = "holonics-cuda"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "holonics_cuda"
path = "src/lib.rs"

# `holonics-portable` is the no_std law crate. mount-link-gate stages the configuration-fold GATE DATA and the
# host reference through the SAME law code the CUDA kernel compiles for nvptx — one mouth, both sides.
[dependencies]
holonics-portable = { path = "../holonics-portable" }
soma-abi = { path = "../holonic-abi" }
# The exact word rings (`ExactRing`, `ModularWords`, …), host-only, re-exported at their old paths.
holonic-words = { path = "../holonic-words" }

[[bin]]
name = "mount-smoke"
path = "src/bin/mount-smoke.rs"

[[bin]]
name = "mount-link-gate"
path = "src/bin/mount-link-gate.rs"

[[bin]]
name = "mount-founded-gate"
path = "src/bin/mount-founded-gate.rs"

[[bin]]
name = "mount-chart-gate"
path = "src/bin/mount-chart-gate.rs"

[[bin]]
name = "mount-scope-gate"
path = "src/bin/mount-scope-gate.rs"

[[bin]]
name = "mount-register-gate"
path = "src/bin/mount-register-gate.rs"
