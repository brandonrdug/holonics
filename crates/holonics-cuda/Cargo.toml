[package]
name = "holonics-cuda"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "holonics_cuda"
path = "src/lib.rs"

[dependencies]
holonics = { path = "../holonics" }
num-bigint = { workspace = true }
num-rational = { workspace = true }
num-traits = { workspace = true }
rayon = "1.12"
thiserror = { workspace = true }

# [measurement; theory, November 12, P53 item 1 (G120)] A ruler build of the profile example: the contact's rows with their memory and without
# their arithmetic (`field_yard_rows`), immediately before the entry, its stores into scratch. No learner's build enables it.
[features]
ruler-rows-reads = []
# [measurement; theory, November 12, P54 item 1] A ruler build of the profile example: the words' occupied bits by array and clock
# (`field_yard_bits_*`). No learner's build enables it.
ruler-bits = []
# [measurement; theory, November 13, P59 item 2] A ruler build of the profile example: the contact's copies, one mechanism a copy, each launched
# immediately before its entry on its words with the entry's outputs in scratch (`tools/contact_copies.py`). No learner's build enables it.
ruler-copies = []

[[bin]]
name = "mount-smoke"
path = "src/bin/mount-smoke.rs"

# The notebook's exposure command, built beside the device port: `realization card` runs campaign
# 1's exposure on the card (the default stays the host reference).
[[example]]
name = "hnn_exposure"
path = "../../research/notebook/hnn_design/hnn_exposure.rs"

# The shared MNIST observed runner defaults to the resident CUDA port; `--backend host` runs the
# exact reference through the same exterior encoding, decoding and reporting path.
[[example]]
name = "mnist_observed"
path = "examples/mnist_observed.rs"

# The observed listener's shared exterior, with an explicit epoch realization.
[[example]]
name = "listener_observed"
path = "examples/listener_observed.rs"
