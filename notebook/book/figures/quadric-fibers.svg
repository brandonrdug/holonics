<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">Real characteristic fibers by discriminant sign</title>
  <desc id="desc">A one-sheet hyperboloid, double cone, and two-sheet hyperboloid represent positive, zero, and negative discriminant.</desc>
  <defs>
    <style>
      .panel{fill:#fbfcff;stroke:#cad2df;stroke-width:1.5}
      .axis{fill:none;stroke:#68758a;stroke-width:1.2}
      .blue{fill:none;stroke:#315da8;stroke-width:2}
      .blue2{fill:none;stroke:#7895c7;stroke-width:1.25}
      .gold{fill:none;stroke:#a66f10;stroke-width:2}
      .gold2{fill:none;stroke:#c99a49;stroke-width:1.25}
      .violet{fill:none;stroke:#73519d;stroke-width:2}
      .violet2{fill:none;stroke:#a18aba;stroke-width:1.25}
      .label{fill:#172033;font-family:serif;font-size:17px}
      .head{font-family:serif;font-weight:700;font-size:19px}
    </style>
  </defs>

  <rect class="panel" x="10" y="10" width="300" height="310" rx="10"/>
  <rect class="panel" x="330" y="10" width="300" height="310" rx="10"/>
  <rect class="panel" x="650" y="10" width="300" height="310" rx="10"/>

  <text class="head" x="91" y="40" fill="#315da8">Δ &gt; 0</text>
  <text class="label" x="65" y="65">one-sheet hyperboloid</text>
  <line class="axis" x1="160" y1="76" x2="160" y2="268"/>
  <line class="axis" x1="62" y1="173" x2="258" y2="173"/>
  <ellipse class="blue2" cx="160" cy="96" rx="63" ry="15"/>
  <ellipse class="blue2" cx="160" cy="127" rx="47" ry="12"/>
  <ellipse class="blue" cx="160" cy="173" rx="34" ry="9"/>
  <ellipse class="blue2" cx="160" cy="219" rx="47" ry="12"/>
  <ellipse class="blue2" cx="160" cy="250" rx="63" ry="15"/>
  <path class="blue" d="M97 96 C130 127 130 219 97 250"/>
  <path class="blue" d="M223 96 C190 127 190 219 223 250"/>
  <text class="label" x="73" y="298">x² + y² − z² = Δ</text>

  <text class="head" x="430" y="40" fill="#a66f10">Δ = 0</text>
  <text class="label" x="429" y="65">double cone</text>
  <line class="axis" x1="480" y1="76" x2="480" y2="268"/>
  <line class="axis" x1="382" y1="173" x2="578" y2="173"/>
  <path class="gold" d="M415 91 L480 173 L545 91"/>
  <path class="gold" d="M415 255 L480 173 L545 255"/>
  <ellipse class="gold2" cx="480" cy="101" rx="57" ry="14"/>
  <ellipse class="gold2" cx="480" cy="132" rx="32" ry="8"/>
  <ellipse class="gold2" cx="480" cy="214" rx="32" ry="8"/>
  <ellipse class="gold2" cx="480" cy="245" rx="57" ry="14"/>
  <circle cx="480" cy="173" r="4" fill="#a66f10"/>
  <text class="label" x="393" y="298">singular scalar tip</text>

  <text class="head" x="731" y="40" fill="#73519d">Δ &lt; 0</text>
  <text class="label" x="693" y="65">two-sheet hyperboloid</text>
  <line class="axis" x1="800" y1="76" x2="800" y2="268"/>
  <line class="axis" x1="702" y1="173" x2="898" y2="173"/>
  <ellipse class="violet2" cx="800" cy="94" rx="56" ry="14"/>
  <ellipse class="violet2" cx="800" cy="119" rx="35" ry="9"/>
  <ellipse class="violet2" cx="800" cy="139" rx="15" ry="4"/>
  <path class="violet" d="M744 94 C771 112 784 131 800 145"/>
  <path class="violet" d="M856 94 C829 112 816 131 800 145"/>
  <ellipse class="violet2" cx="800" cy="207" rx="15" ry="4"/>
  <ellipse class="violet2" cx="800" cy="227" rx="35" ry="9"/>
  <ellipse class="violet2" cx="800" cy="252" rx="56" ry="14"/>
  <path class="violet" d="M800 201 C784 215 771 234 744 252"/>
  <path class="violet" d="M800 201 C816 215 829 234 856 252"/>
  <text class="label" x="705" y="298">two disconnected sheets</text>
</svg>

