<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">Discriminant deformation and conjugation tangent flow</title>
  <desc id="desc">A parameterized discriminant crosses zero on the left, while a commutator tangent remains inside a fixed receiver fiber on the right.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315da8"/>
    </marker>
    <style>
      .panel{fill:#fbfcff;stroke:#cad2df;stroke-width:1.5}
      .axis{fill:none;stroke:#68758a;stroke-width:1.3}
      .line{fill:none;stroke:#315da8;stroke-width:2.2}
      .dash{fill:none;stroke:#a66f10;stroke-width:1.5;stroke-dasharray:6 5}
      .fiber{fill:#edf3fc;stroke:#315da8;stroke-width:1.8}
      .orbit{fill:none;stroke:#73519d;stroke-width:2.1}
      .label{fill:#172033;font-family:serif;font-size:17px}
      .head{font-family:serif;font-weight:700;font-size:19px;fill:#315da8}
    </style>
  </defs>

  <rect class="panel" x="10" y="10" width="455" height="300" rx="10"/>
  <rect class="panel" x="495" y="10" width="455" height="300" rx="10"/>

  <text class="head" x="32" y="42">crossing the discriminant stratum</text>
  <line class="axis" x1="65" y1="168" x2="430" y2="168" marker-end="url(#arrow)"/>
  <line class="axis" x1="100" y1="268" x2="100" y2="65" marker-end="url(#arrow)"/>
  <text class="label" x="435" y="174">λ</text>
  <text class="label" x="79" y="67">Δ</text>
  <line class="dash" x1="100" y1="168" x2="430" y2="168"/>
  <path class="line" d="M76 244 L407 88"/>
  <circle cx="238" cy="168" r="5" fill="#a66f10"/>
  <line class="dash" x1="238" y1="168" x2="238" y2="264"/>
  <text class="label" x="218" y="286">λ*</text>
  <text class="label" x="124" y="91">Δ(λ) = (a−d)² + 4λbc</text>
  <text class="label" x="284" y="135" fill="#315da8">Δ &gt; 0</text>
  <text class="label" x="126" y="220" fill="#73519d">Δ &lt; 0</text>
  <text class="label" x="178" y="156" fill="#a66f10">transition locus</text>

  <text class="head" x="520" y="42">motion inside one receiver fiber</text>
  <ellipse class="fiber" cx="719" cy="173" rx="158" ry="82" transform="rotate(-10 719 173)"/>
  <ellipse cx="719" cy="173" rx="112" ry="47" transform="rotate(-10 719 173)" fill="none" stroke="#7895c7" stroke-width="1.2" stroke-dasharray="5 5"/>
  <path class="orbit" d="M606 190 C640 118 770 104 839 157" marker-end="url(#arrow)"/>
  <circle cx="695" cy="142" r="6" fill="#315da8"/>
  <path class="line" d="M695 142 C725 133 746 139 766 151" marker-end="url(#arrow)"/>
  <text class="label" x="652" y="128">M</text>
  <text class="label" x="752" y="126">Ṁ = [X,M]</text>
  <text class="label" x="606" y="232">tr(Ṁ)=0</text>
  <text class="label" x="722" y="245">D(det)ₘ(Ṁ)=0</text>
  <text class="label" x="610" y="286">the orbit direction is tangent to Φ⁻¹(t,p)</text>
</svg>

