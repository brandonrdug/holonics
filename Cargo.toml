# Holonics.
#
# `crates/holonics` is the main library: the Holon law and its operators (ratio, geometry, holon,
# navigator, receiver), exact over the rationals, with no float in a law. `crates/holonics-cuda`
# is the CUDA realization, currently the device driver.
[workspace]
resolver = "2"
members = [
  "crates/holonics",
  "crates/holonics-cuda",
]
# The nvptx smoke kernel pins its own nightly. Its committed PTX is included by `mount-smoke`,
# so the host workspace carries that boundary artifact without carrying the toolchain.
exclude = [
  "accelerators/cuda-smoke",
  "vendor/num-bigint",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# num-bigint 0.4.8 with one change: its `gcd` splits off the common power of two first and returns
# at once when an odd part is one, so a power-of-two denominator no longer costs a walk down the
# other operand one bit at a time (60% of Athena's native training time was that gcd). The values
# are the same; `vendor/num-bigint/src/biguint.rs` carries the patch.
[patch.crates-io]
num-bigint = { path = "vendor/num-bigint" }

[workspace.dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
thiserror = "2"

[profile.release]
opt-level = 3
lto = true

# Exact arithmetic dominates the tests' time, and the big-integer kernels are the dependencies'
# non-generic code: optimize them in debug and test builds (the workspace's own code stays at the
# debug level). The HNN tests run about four times faster.
[profile.dev.package.num-bigint]
opt-level = 3

[profile.dev.package.num-integer]
opt-level = 3

