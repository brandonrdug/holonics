  destination_commit: resolved by Git history; not self-embedded

licensing:
  repository_grant: none-declared
  notes: >-
    The source Rust manifests state MIT OR Apache-2.0, but license texts and the scope covering
    documentation, formal sources, and publications were absent. No public redistribution grant
    is inferred by this private extraction.

default_excludes:
