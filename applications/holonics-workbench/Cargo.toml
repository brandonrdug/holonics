[package]
name = "holonics-workbench"
version = "0.4.0"
edition = "2021"
publish = false

[[bin]]
name = "holonics"
path = "src/main.rs"

[dependencies]
athena-alpha = { path = "../athena-alpha" }
holonics-application = { path = "../holonics-application" }
life = { path = "../../soma/life" }
holonic-engine = { path = "../../crates/holonic-engine", default-features = false }
clap = { version = "4.5", features = ["derive"] }
serde = { workspace = true }
serde_json = "1"
num-bigint = { workspace = true }
num-rational = { workspace = true }
num-traits = "0.2"
thiserror = { workspace = true }

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
