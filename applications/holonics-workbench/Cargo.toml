[package]
name = "holonics-workbench"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "holonics"
path = "src/main.rs"

[dependencies]
athena-alpha = { path = "../athena-alpha" }
life = { path = "../../soma/life" }
holonic-engine = { path = "../../crates/holonic-engine", default-features = false }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde = { workspace = true }
serde_json = "1"
shlex = "1.3"
num-bigint = { workspace = true }
num-rational = { workspace = true }
num-traits = "0.2"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
