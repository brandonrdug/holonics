[package]
name = "holonics-workbench"
version = "0.4.0"
edition = "2021"
publish = false

[[bin]]
name = "holonics"
path = "src/main.rs"

[dependencies]
holonics-hna = { path = "../../crates/holonics-hna" }
holonics = { path = "../../crates/holonics" }
holonics-workspace = { path = "../../crates/holonics-workspace" }
life = { path = "../../crates/holonic-life" }
holonic-engine = { path = "../../crates/holonic-engine", default-features = false }
clap = { version = "4.5", features = ["derive"] }
serde = { workspace = true }
serde_json = "1"
num-bigint = { workspace = true }
num-rational = { workspace = true }
num-traits = "0.2"
thiserror = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
