<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img"
     aria-labelledby="title description">
  <title id="title">Ordered point occurrences for the harmonic-conjugation calibration</title>
  <desc id="description">A finite affine board with A prime, B, A, and D, beside a board-at-infinity face.</desc>
  <rect width="960" height="220" fill="#fbfaf5"/>
  <g fill="none" stroke="#173a3a" stroke-width="4" stroke-linecap="round">
    <path d="M70 92 H650"/>
    <path d="M650 92 H825" stroke-dasharray="10 12"/>
    <path d="M825 92 l-18 -10 m18 10 l-18 10"/>
  </g>
  <g fill="#a13d2d" stroke="#a13d2d">
    <circle cx="110" cy="92" r="8"/>
    <circle cx="295" cy="92" r="8"/>
    <circle cx="405" cy="92" r="8"/>
    <circle cx="625" cy="92" r="8"/>
  </g>
  <g font-family="Libertinus Serif, serif" font-size="30" fill="#101820" text-anchor="middle">
    <text x="110" y="65">A&#x2032;</text>
    <text x="295" y="65">B</text>
    <text x="405" y="65">A</text>
    <text x="625" y="65">D</text>
    <text x="848" y="65">&#x221E;</text>
    <text x="904" y="65">8</text>
  </g>
  <g font-family="Libertinus Serif, serif" font-size="22" fill="#4d5656" text-anchor="middle">
    <text x="365" y="145">finite-board ordered point occurrences</text>
    <text x="848" y="145">board at infinity</text>
    <text x="940" y="180" text-anchor="end">glyph control</text>
  </g>
  <g stroke="#7a355f" stroke-width="2">
    <path d="M861 45 C874 28, 890 28, 900 45" fill="none"/>
  </g>
</svg>
