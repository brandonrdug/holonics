<div id="hnn-field-architecture">
  <h2>A field received by another Holon</h2>
  <div class="viz-controls" aria-label="Inspect a Holonic operation">
    <button type="button" class="btn" data-focus="whole" aria-pressed="true">Whole object</button>
    <button type="button" class="btn" data-focus="reception" aria-pressed="false">Reception</button>
    <button type="button" class="btn" data-focus="contact" aria-pressed="false">Attention &amp; contact</button>
    <button type="button" class="btn" data-focus="interior" aria-pressed="false">Internal circulation</button>
    <button type="button" class="btn" data-focus="generation" aria-pressed="false">Generation</button>
    <button type="button" class="btn" data-focus="receiver" aria-pressed="false">Receiver</button>
  </div>
  <div class="viz-controls">
    <button type="button" class="btn" data-play>Play receiver motion</button>
    <label class="form-label">Receiver proper time τ / T₀: <output data-time>0</output>
      <input class="form-range" data-time-slider type="range" min="0" max="64" value="32" step="1" aria-label="Receiver proper-time section">
    </label>
  </div>
  <svg class="field-diagram" role="img" aria-label="The viewing camera stays fixed. A toroidal receiving body moves across three null-ray currents from the source field. Its oriented aperture selects the received channels."></svg>
  <div class="receiver-panels">
    <div><svg class="receiver-face" role="img" aria-label="The received ray intersections in the moving detector's own spatial coordinates."></svg></div>
    <div><svg class="receiver-entropy" role="img" aria-label="Entropy and cross-entropy of the received current partition as the aperture moves through the unchanged ray field."></svg></div>
  </div>
  <div class="text-small" aria-live="polite" data-detail></div>
  <div class="text-small text-muted">Supplied inertial receiver and null-ray field in a local Minkowski chart · exact aperture and frame calculations · the toroidal network remains an architecture schematic.</div>
</div>
<style>
#hnn-field-architecture .field-diagram,#hnn-field-architecture .receiver-face,#hnn-field-architecture .receiver-entropy {display:block;width:100%;overflow:visible;}
#hnn-field-architecture svg text {fill:var(--foreground);font-family:inherit;font-size:12px;font-weight:400;}
#hnn-field-architecture svg .label-main {font-weight:500;}
#hnn-field-architecture [data-detail] {min-height:2.8em;margin-block:8px;}
#hnn-field-architecture .receiver-panels {display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:540px){#hnn-field-architecture .receiver-panels{grid-template-columns:1fr;}}
</style>
<script>
(() => {
 const root=document.getElementById('hnn-field-architecture'),svg=root.querySelector('.field-diagram');
 const faceSvg=root.querySelector('.receiver-face'),entropySvg=root.querySelector('.receiver-entropy');
 const data=@@GEOMETRY@@,R=data.receiver,NS='http://www.w3.org/2000/svg';
 const colors={reception:'var(--viz-series-1)',contact:'var(--viz-series-2)',interior:'var(--viz-series-3)',generation:'var(--viz-series-4)',receiver:'var(--viz-series-5)'};
 const details={
  whole:'The receiver has its own world-tube, aperture and field coordinates. Moving it changes which ray channels interact and how their faces are represented.',
  reception:'An incoming occurrence is received through an actual contact and frame. A source field can stay unchanged while the receiving face changes.',
  contact:'Attention combines participation and transported current over admitted overlaps. The receiving interaction includes both Holons and their material.',
  interior:'The source and receiver each have an interior. A measured face leaves a preimage family; internal modes and admissible future receptions determine what can be compressed.',
  generation:'The three magenta rays follow declared null generators to a physical receiving surface. Generation can become an internal face or an external emission through the same relation.',
  receiver:'The receiver moves with β = 3/5 and γ = 5/4. Its local coordinate rate is du/dτ = −3/5. The measured packet energies are 4/5, 20/13 and 17/10 E₀.'
 };
 const num=s=>{const [a,b]=String(s).split('/');return Number(a)/(b?Number(b):1);};
 let focus='whole',index=32,playing=false,timer=null;
 const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(reducedMotion)root.querySelector('[data-play]').textContent='Next receiver frame';
 function el(tag,attrs={},parent=svg){const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);parent.append(n);return n;}
 function path(d,color,width=1,opacity=1,extra={},parent=svg){return el('path',{d,stroke:color,'stroke-width':width,opacity,fill:'none',...extra},parent);}
 function label(x,y,s,anchor='start',cls='',parent=svg){const n=el('text',{x,y,'text-anchor':anchor,class:cls},parent);n.textContent=s;return n;}
 function active(key){return focus==='whole'||focus===key||(key==='generation'&&focus==='receiver')||(key==='receiver'&&focus==='generation');}
 function opac(key,on=1){return active(key)?on:0.15;}
 function setup(s,w,h){s.replaceChildren();s.setAttribute('viewBox',`0 0 ${w} ${h}`);s.style.height=h+'px';}
 function entropy(p,q=p){return p.reduce((s,x,i)=>x>0?s-x*Math.log(q[i]):s,0);}
 // All nonlinear numerical evaluation below is a display receiver of stored exact rational weights.
 const probabilities=R.frames.map(f=>f.probabilities.map(num)),reference=R.reference_probabilities.map(num);
 const entropies=probabilities.map(p=>entropy(p)),crossEntropies=probabilities.map(p=>entropy(p,reference));
 function draw(){
  const w=Math.max(280,root.clientWidth),small=w<540,f=R.frames[index];
  const spanX=data.bounds[0][1]-data.bounds[0][0],spanY=data.bounds[1][1]-data.bounds[1][0];
  const plottedHeight=Math.min(400,(w-36)*spanY/spanX),h=plottedHeight+155;setup(svg,w,h);
  const defs=el('defs');for(const key of Object.keys(colors)){
   const marker=el('marker',{id:`hfa-${key}`,viewBox:'0 0 8 8',refX:7,refY:4,markerWidth:5,markerHeight:5,orient:'auto'},defs);
   el('path',{d:'M0 0 L8 4 L0 8 Z',fill:colors[key]},marker);
  }
  const bounds=data.bounds,[xmin,xmax]=bounds[0],[ymin,ymax]=bounds[1];
  const scale=Math.min((w-36)/(xmax-xmin),plottedHeight/(ymax-ymin));
  const P=p=>[w/2+(p[0]-(xmin+xmax)/2)*scale,100+(p[1]-ymin)*scale];
  const poly=line=>line.map((p,i)=>{const q=P(p);return `${i?'L':'M'}${q[0].toFixed(2)},${q[1].toFixed(2)}`;}).join(' ');
  const shift=p=>p.map((v,k)=>v+f.display_shift[k]);
  const body=data.regions.flatMap(r=>r.mesh.map(line=>({line,z:line.reduce((s,p)=>s+p[2],0)/line.length}))).sort((a,b)=>a.z-b.z);
  for(const item of body)path(poly(item.line),'var(--foreground)',0.7,0.12);
  for(const patch of data.patches)el('path',{d:poly(patch.points)+'Z',fill:colors.contact,opacity:opac('contact',0.3),stroke:colors.contact,'stroke-width':0.35});
  for(const region of data.regions){
   region.strands.forEach((line,k)=>path(poly(line),colors.interior,k===0?1.6:0.6,opac('interior',k===0?0.72:0.25)));
   path(poly(region.strands[0].slice(18,24)),colors.interior,1.6,opac('interior',0.8),{'marker-end':'url(#hfa-interior)'});
  }
  const c=data.regions.map(r=>P(r.center));
  [[0,1],[1,2],[2,3],[3,4],[2,5],[1,5],[3,5]].forEach(([a,b],i)=>{
   const A=c[a],B=c[b],lift=(i%2?1:-1)*22;
   path(`M${A[0]},${A[1]} Q${(A[0]+B[0])/2},${(A[1]+B[1])/2+lift} ${B[0]},${B[1]}`,colors.contact,1.7,opac('contact',0.75));
  });
  label(w/2,26,'Encoding into situated sections','middle','label-main');
  label(w/2,44,small?'Text · image · acoustics · internal':'Text / image / acoustic fields / internal occurrences','middle');
  [0,5,4].forEach((region,i)=>{const a=c[region],x=w*(i+1)/4;path(`M${x},56 Q${x},80 ${a[0]},${a[1]}`,colors.reception,3,opac('reception',0.55),{'marker-end':'url(#hfa-reception)'});});
  c.forEach((p,i)=>{el('circle',{cx:p[0],cy:p[1],r:9,fill:'var(--background)',opacity:0.85});label(p[0],p[1]+4,String(i),'middle');});
  // The world camera and rays stay fixed; only the represented receiving body moves.
  R.beams.forEach((beam,i)=>{
   const hit=P(beam.hit_display),src=P(beam.source_display),admitted=f.accepted[i];
   path(`M${src[0]},${src[1]} L${hit[0]},${hit[1]}`,colors.generation,admitted?2.6:1.1,opac('generation',admitted?0.85:0.3),{'marker-end':'url(#hfa-generation)',...(admitted?{}:{'stroke-dasharray':'4 4'})});
   el('circle',{cx:src[0],cy:src[1],r:3,fill:colors.generation,opacity:opac('generation')});
   el('circle',{cx:hit[0],cy:hit[1],r:admitted?4:3,fill:admitted?colors.generation:'var(--background)',stroke:colors.generation,opacity:opac('generation')});
  });
  path(poly(R.frames.map(g=>R.base_center.map((v,k)=>v+g.display_shift[k]))),'var(--foreground)',0.8,0.35,{'stroke-dasharray':'2 3'});
  el('path',{d:poly(R.aperture.map(shift))+'Z',fill:colors.receiver,'fill-opacity':0.06,stroke:colors.receiver,'stroke-width':1.2,opacity:opac('receiver')});
  R.rim.forEach(line=>path(poly(line.map(shift)),colors.receiver,0.7,opac('receiver',0.32)));
  R.interior.forEach(line=>path(poly(line.map(shift)),colors.interior,0.8,opac('receiver',0.5)));
  const center=P(shift(R.base_center)),axes=R.axes.map(a=>P(shift(a)));
  for(let j=1;j<4;j++)path(`M${center[0]},${center[1]} L${axes[j][0]},${axes[j][1]}`,colors.receiver,1.1,opac('receiver',0.8),{'marker-end':'url(#hfa-receiver)'});
  label(center[0]-8,center[1]-5,'R','end','label-main');
  label(axes[3][0]+7,axes[3][1],'n_R');
  label(center[0],Math.min(h-25,center[1]+62),'Receiving Holon · moving aperture','middle','label-main');
  label(w/2,h-4,small?'R moves; the viewing camera is fixed.':'R moves through the ray field; the viewing camera is fixed.','middle');
  drawFace(f);drawEntropy();
  root.querySelector('[data-time]').textContent=f.proper_time;root.querySelector('[data-time-slider]').value=String(index);
  root.querySelector('[data-detail]').textContent=details[focus];
 }
 function drawFace(f){
  const w=Math.max(260,faceSvg.parentElement.clientWidth),h=285;setup(faceSvg,w,h);
  const m=40,extent=Math.min(w-2*m,165),cx=w/2,cy=120,k=extent/5;
  label(w/2,18,'Face in the receiver’s own frame','middle','label-main',faceSvg);
  el('rect',{x:cx-extent/2,y:cy-extent/2,width:extent,height:extent,fill:'none',stroke:'var(--border)','data-chart-frame':''},faceSvg);
  el('circle',{cx,cy,r:2*k,fill:'none',stroke:colors.receiver,'stroke-width':1.1},faceSvg);
  path(`M${cx-2.5*k},${cy}H${cx+2.5*k} M${cx},${cy-2.5*k}V${cy+2.5*k}`,'var(--border)',0.8,1,{},faceSvg);
  [-2,0,2].forEach(t=>{label(cx+t*k,cy+2.5*k+15,String(t),'middle','',faceSvg);if(t!==0)label(cx-2.5*k-9,cy-t*k+4,String(t),'end','',faceSvg);});
  label(w/2,cy+2.5*k+33,'u_R / L₀','middle','',faceSvg).setAttribute('data-axis','x');
  label(10,cy,'v_R / L₀','start','',faceSvg).setAttribute('transform',`rotate(-90,10,${cy})`);
  f.local_faces.forEach((p,i)=>{
   const x=cx+num(p[0])*k,y=cy-num(p[1])*k;
   const withinBox=Math.abs(num(p[0]))<=2.5&&Math.abs(num(p[1]))<=2.5;
   if(withinBox){
    el('circle',{cx:x,cy:y,r:5,fill:f.accepted[i]?colors.generation:'var(--background)',stroke:colors.generation},faceSvg);
    label(x+(i===1?8:-8),y+(i===1?15:-9),String(i+1),i===1?'start':'end','',faceSvg);
   }
  });
  label(w/2,275,`Admitted channels: ${f.accepted.map((a,i)=>a?String(i+1):'').filter(Boolean).join(', ')||'none'}`,'middle','',faceSvg);
 }
 function drawEntropy(){
  const w=Math.max(260,entropySvg.parentElement.clientWidth),h=285;setup(entropySvg,w,h);
  const x0=52,x1=w-16,y0=45,y1=215,ymax=Math.max(...entropies,...crossEntropies)*1.08;
  const X=i=>x0+4+(x1-x0-8)*i/64,Y=e=>y1-4-(y1-y0-8)*e/ymax;
  label(w/2,18,'Entropy of the received partition','middle','label-main',entropySvg);
  el('rect',{x:x0,y:y0,width:x1-x0,height:y1-y0,fill:'none',stroke:'var(--border)','data-chart-frame':''},entropySvg);
  [0,Math.log(2),Math.log(3)].forEach((e,i)=>{const y=Y(e);path(`M${x0},${y}H${x1}`,'var(--border)',0.7,0.7,{},entropySvg);label(x0-7,y+4,['0','log 2','log 3'][i],'end','',entropySvg);});
  [0,16,32,48,64].forEach(i=>label(X(i),y1+17,String((i-32)/16),'middle','',entropySvg));
  const step=values=>values.map((v,i)=>`${i?'H'+X(i)+' V':'M'+X(i)+','}${Y(v)}`).join(' ');
  path(step(entropies),colors.receiver,1.6,1,{},entropySvg);
  path(step(crossEntropies),colors.contact,1.4,1,{'stroke-dasharray':'5 3'},entropySvg);
  path(`M${X(index)},${y0}V${y1}`,'var(--foreground)',0.8,0.5,{},entropySvg);
  for(const [values,color] of [[entropies,colors.receiver],[crossEntropies,colors.contact]])el('circle',{cx:X(index),cy:Y(values[index]),r:3,fill:color},entropySvg);
  label(w/2,255,'τ / T₀','middle','',entropySvg).setAttribute('data-axis','x');
  label(12,120,'nats','middle','',entropySvg).setAttribute('transform','rotate(-90,12,120)');
  path(`M${x0},30h16`,colors.receiver,1.6,1,{},entropySvg);label(x0+21,34,'H_R','start','',entropySvg);
  path(`M${x0+66},30h16`,colors.contact,1.4,1,{'stroke-dasharray':'5 3'},entropySvg);label(x0+87,34,'cross-entropy','start','',entropySvg);
 }
 function stop(){playing=false;if(timer)clearTimeout(timer);root.querySelector('[data-play]').textContent=reducedMotion?'Next receiver frame':'Play receiver motion';}
 function tick(){if(!playing)return;if(index>=64){stop();return;}index++;draw();timer=setTimeout(tick,100);}
 root.querySelector('[data-play]').addEventListener('click',()=>{if(reducedMotion){index=Math.min(64,index+1);draw();return;}if(playing){stop();return;}index=0;playing=true;root.querySelector('[data-play]').textContent='Pause';draw();timer=setTimeout(tick,100);});
 root.querySelector('[data-time-slider]').addEventListener('input',e=>{stop();index=Number(e.target.value);draw();});
 root.querySelectorAll('[data-focus]').forEach(b=>b.addEventListener('click',()=>{focus=b.dataset.focus;root.querySelectorAll('[data-focus]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw();}));
 new ResizeObserver(draw).observe(root);draw();
})();
</script>
