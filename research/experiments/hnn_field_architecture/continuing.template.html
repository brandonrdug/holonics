<div id="continuing-holonic-field">
  <h2>The continuing field, seen by receiver R</h2>
  <div class="viz-controls">
    <button type="button" class="btn" data-play>Play field evolution</button>
    <label class="form-label">Evolution τ / T₀: <output data-clock>0</output>
      <input type="range" class="form-range" min="0" max="24" step="1" value="0" data-step aria-label="Field evolution cut">
    </label>
    <label class="form-check"><input type="checkbox" class="form-check-input" data-modes><span class="form-check-label">Transported toroidal modes</span></label>
  </div>
  <div class="field-surface">
    <img data-field alt="Receiver image of an evolving coupled complex field. Its toroidal support deforms, mode currents diffuse through contacts, and thermal activity changes throughout the volume.">
    <canvas data-curves aria-hidden="true"></canvas>
  </div>
  <div class="text-small" data-state aria-live="polite"></div>
  <div class="text-small text-muted">Fixed receiver and exposure · colour reads complex amplitude and thermal activity · every frame reconstructs the evolving volume.</div>
</div>
<style>
#continuing-holonic-field .field-surface {position:relative;}
#continuing-holonic-field [data-field] {display:block;width:100%;height:auto;}
#continuing-holonic-field [data-curves] {position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
#continuing-holonic-field [data-state] {margin-block:6px;}
</style>
<script>
(()=>{
 const root=document.getElementById('continuing-holonic-field');
 const frames=@@FRAMES@@;
 frames.forEach(f=>f.curves=f.curves.map(s=>{const bytes=Uint8Array.from(atob(s),x=>x.charCodeAt(0)),view=new DataView(bytes.buffer),p=[];for(let i=0;i<bytes.length;i+=4)p.push([view.getInt16(i,true),view.getInt16(i+2,true)]);return p;}));
 const img=root.querySelector('[data-field]'),canvas=root.querySelector('[data-curves]'),slider=root.querySelector('[data-step]'),play=root.querySelector('[data-play]');
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 let index=0,running=false,timer=null;
 slider.max=String(frames.length-1);
 const images=frames.map(f=>{const image=new Image();image.src=f.image;return image;});
 function strokeColor(){const e=document.createElement('span');e.style.color='var(--muted-foreground)';root.append(e);const c=getComputedStyle(e).color;e.remove();return c;}
 function drawCurves(){
  const w=img.clientWidth,h=img.clientHeight,dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);
  if(!root.querySelector('[data-modes]').checked)return;
  ctx.strokeStyle=strokeColor();ctx.lineWidth=0.7;ctx.globalAlpha=0.7;
  for(const curve of frames[index].curves){ctx.beginPath();curve.forEach((p,i)=>{const x=(p[0]/1000+11)/22*w,y=(8.25-p[1]/1000)/16.5*h;if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y);});ctx.stroke();}
 }
 function show(){const f=frames[index];img.src=f.image;slider.value=String(index);root.querySelector('[data-clock]').textContent=f.clock;root.querySelector('[data-state]').textContent=`Coupled evolution ${f.index} · current, heat and geometry from the same state · exact mode energy + heat = 10`;drawCurves();}
 function stop(){running=false;clearTimeout(timer);play.textContent=reduced?'Next field cut':'Play field evolution';}
 function tick(){if(!running)return;if(index>=frames.length-1){stop();return;}index++;show();timer=setTimeout(tick,120);}
 play.addEventListener('click',()=>{if(reduced){index=Math.min(index+1,frames.length-1);show();return;}if(running){stop();return;}if(index===frames.length-1)index=0;running=true;play.textContent='Pause';show();timer=setTimeout(tick,120);});
 slider.addEventListener('input',()=>{stop();index=Number(slider.value);show();});
 root.querySelector('[data-modes]').addEventListener('change',drawCurves);
 img.addEventListener('load',drawCurves);new ResizeObserver(drawCurves).observe(img);
 stop();show();
})();
</script>
